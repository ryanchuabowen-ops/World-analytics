name: Refresh live data snapshot

# Runs the same real-world-data fetch the browser does (World Bank, IMF, WHO,
# Eurostat, OECD), server-side, so it never hits CORS/rate-limit issues and
# gives every visitor a fresh fallback even if their browser can't reach the
# APIs directly. Committing data/live-data.json triggers the existing Pages
# deploy workflow (static.yml) automatically.

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest indicators
        run: node scripts/fetch-data.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/live-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-data.json
          git commit -m "chore: refresh live data snapshot"
          git push
